name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  fast-feedback:
    name: Fast test feedback
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-feedback

      - name: Stub private PureReason deps (not available in CI)
        run: |
          mkdir -p ../../AI/PureReason/crates
          cp -r stubs/pure-reason-core ../../AI/PureReason/crates/
          cp -r stubs/pure-reason-verifier ../../AI/PureReason/crates/

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libblas-dev liblapack-dev libopenblas-dev gfortran

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run fast/default test suite
        # --no-default-features skips embed/rerank which require downloaded model files
        # and build BLAS from source. Core BM25, neurons, KG, diary, and MCP logic
        # are all fully exercised without these features.
        run: cargo nextest run --no-default-features

  full-proof:
    name: Full proof and local-core guardrails
    runs-on: ubuntu-latest
    needs: fast-feedback
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-feedback

      - name: Stub private PureReason deps (not available in CI)
        run: |
          mkdir -p ../../AI/PureReason/crates
          cp -r stubs/pure-reason-core ../../AI/PureReason/crates/
          cp -r stubs/pure-reason-verifier ../../AI/PureReason/crates/

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libblas-dev liblapack-dev libopenblas-dev gfortran

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run full proof lane
        run: bash scripts/test-full-proof.sh

      - name: Proof certificate gate
        # Fails if any proof-certificate headline still comes from a fallback value.
        run: cargo run --quiet --no-default-features --bin cortyx -- proof-certificate --validate

      - name: Registry scorecard (visibility)
        run: python3 scripts/benchmark_registry.py scorecard

      - name: Write scorecard to step summary
        if: always()
        run: python3 scripts/benchmark_registry.py scorecard >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
