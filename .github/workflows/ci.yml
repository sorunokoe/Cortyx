name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  fast-feedback:
    name: Fast test feedback
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-feedback

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run fast/default test suite
        run: cargo nextest run

  full-proof:
    name: Full proof and local-core guardrails
    runs-on: ubuntu-latest
    needs: fast-feedback
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-feedback

      - name: Run full proof lane
        run: bash scripts/test-full-proof.sh
