name: Quality

on:
  push:
    branches: [ main, master, refactor/* ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      
      - name: Check formatting
        run: cargo fmt --all -- --check

  lint:
    name: Clippy Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      
      - name: Stub private PureReason deps (not available in CI)
        run: |
          mkdir -p ../../AI/PureReason/crates
          cp -r stubs/pure-reason-core ../../AI/PureReason/crates/
          cp -r stubs/pure-reason-verifier ../../AI/PureReason/crates/

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache target directory
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run clippy
        # -D warnings enforces all deny/warn lints declared in Cargo.toml.
        # Run without default features to avoid requiring ONNX model download in CI.
        # Use --lib --bins to avoid flagging test code (tests use unwrap extensively).
        run: cargo clippy --lib --bins --no-default-features -- -D warnings

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Stub private PureReason deps (not available in CI)
        run: |
          mkdir -p ../../AI/PureReason/crates
          cp -r stubs/pure-reason-core ../../AI/PureReason/crates/
          cp -r stubs/pure-reason-verifier ../../AI/PureReason/crates/

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libblas-dev liblapack-dev libopenblas-dev gfortran
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run tests
        # --no-default-features skips embed/rerank (require downloaded models + BLAS).
        # Core logic is fully covered; embed path is exercised by the Build Check job.
        run: cargo nextest run --no-default-features
      
      - name: Run doc tests
        run: cargo test --doc --no-default-features

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: sudo apt-get update -q && sudo apt-get install -y libblas-dev liblapack-dev libopenblas-dev gfortran
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Generate coverage
        # embed/rerank features require ONNX model downloads not available in CI
        # and cause CBLAS linker issues on Ubuntu; core BM25 logic is fully covered.
        run: cargo llvm-cov --no-default-features --lcov --output-path lcov.info
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: false

  build:
    name: Build Check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update -q && sudo apt-get install -y libblas-dev liblapack-dev libopenblas-dev gfortran
      
      - name: Check (Linux, all-features type check without linking)
        # Ubuntu lacks libcblas.so needed by fastembed; cargo check avoids the linker.
        # Full binary linking is verified on macOS below.
        if: matrix.os == 'ubuntu-latest'
        run: cargo check --all-features

      - name: Build (macOS, full binary with all-features)
        if: matrix.os == 'macos-latest'
        run: cargo build --release --all-features
      
      - name: Check binary size (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          SIZE=$(stat -f%z target/release/cortyx)
          echo "Binary size: $SIZE bytes"
          # macOS ARM64 with all-features (embed+rerank+ONNX) produces ~30-40MB.
          # 50MB limit catches egregious regressions without false-positives on macOS.
          if [ $SIZE -gt 52428800 ]; then
            echo "Binary size exceeds 50MB limit!"
            exit 1
          fi
