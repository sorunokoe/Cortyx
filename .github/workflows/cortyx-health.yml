# Cortyx Neuron Health Check (S-IX, TRIZ R16)
#
# Copy this file into your project's .github/workflows/ to monitor neuron health in CI.
# Fails the pipeline when stale_count exceeds the threshold (configurable via STALE_THRESHOLD).
#
# Usage:
#   1. Copy this file to .github/workflows/cortyx-health.yml in your project
#   2. Adjust STALE_THRESHOLD and QUALITY_THRESHOLD as needed
#   3. Run `cortyx compile` in CI before this step, or rely on a cached index

name: Cortyx Neuron Health

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 9 * * 1'  # every Monday at 09:00 UTC

env:
  STALE_THRESHOLD: 5      # fail if stale_count > this
  QUALITY_THRESHOLD: 10   # warn if low_quality_count > this

jobs:
  cortyx-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cortyx
        run: |
          curl -fsSL https://raw.githubusercontent.com/cortyx-ai/cortyx/main/install.sh | bash
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Compile neurons (incremental)
        run: cortyx compile .

      - name: Run Cortyx Doctor (JSON)
        id: doctor
        run: |
          cortyx doctor --json . > doctor.json
          cat doctor.json
          echo "doctor_output=$(cat doctor.json | tr -d '\n')" >> $GITHUB_OUTPUT

      - name: Parse and assert health
        run: |
          STALE=$(cat doctor.json | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('stale_count', 0))")
          QUALITY=$(cat doctor.json | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('low_quality_count', 0))")
          ERRORS=$(cat doctor.json | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('errors', 0))")

          echo "stale_count=$STALE"
          echo "low_quality_count=$QUALITY"
          echo "errors=$ERRORS"

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Cortyx doctor found errors"
            exit 1
          fi

          if [ "$STALE" -gt "$STALE_THRESHOLD" ]; then
            echo "❌ stale_count=$STALE exceeds threshold=$STALE_THRESHOLD — run cortyx compile ."
            exit 1
          fi

          if [ "$QUALITY" -gt "$QUALITY_THRESHOLD" ]; then
            echo "⚠️  low_quality_count=$QUALITY exceeds threshold=$QUALITY_THRESHOLD — run cortyx evolve on stale neurons"
          fi

          echo "✅ Cortyx health check passed (stale=$STALE, low_quality=$QUALITY)"
