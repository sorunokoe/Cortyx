[package]
name = "cortyx"
version = "0.2.0"
edition = "2021"
description = "MCP-native context delivery engine — local long-term memory, prompt-cache-aware context reuse, BM25 + hybrid retrieval"
license = "MIT"
repository = "https://github.com/cortyx-ai/cortyx"
keywords = ["llm", "mcp", "context", "memory", "ai"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Dense embeddings via fastembed (all-MiniLM-L6-v2, 384-dim).
# Downloads ~80 MB of model weights on first use.
# Enables hybrid BM25 + dense cosine retrieval with RRF fusion in get_contexts.
# Falls back gracefully to BM25-only when embeddings.bin is absent or model not installed.
embed = ["dep:fastembed"]
# Cross-encoder reranking via ONNX (ms-marco-MiniLM-L-2-v2 INT8 quantized, ~7 MB).
# Place .cortyx/reranker.onnx in the project root before use.
# Activates only on low-confidence BM25 queries (top_score < LOW_CONFIDENCE_THRESHOLD).
# ~100× smaller and faster than LLM reranking; no API calls; local/private.
rerank = ["dep:ort", "dep:tokenizers"]
# ECS verification gate — PureReason integration.
# Enables hallucination detection on mine_conversation, kg_add, publish-concept, and
# the answer plane. Zero overhead when disabled: all gate functions are no-op stubs.
# Requires PureReason to be checked out at ../../AI/PureReason (sibling directory).
verify = ["dep:pure-reason-verifier", "dep:pure-reason-core"]
# Local LLM answer synthesis via Ollama.
[dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
blake3 = "1.8.4"
rayon = "1"
regex = "1.10"
clap = { version = "4.6.0", features = ["derive"] }
fastembed = { version = "5", optional = true }
ort = { version = "=2.0.0-rc.10", optional = true }
tokenizers = { version = "0.19", optional = true }
pure-reason-verifier = { path = "../../AI/PureReason/crates/pure-reason-verifier", optional = true }
pure-reason-core = { path = "../../AI/PureReason/crates/pure-reason-core", optional = true }
notify = "8.2.0"
rmcp = { version = "1.4.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
dirs = "6.0.0"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
strip = "symbols"
# panic = "abort" removed: cortyx exposes src/lib.rs for in-process use by tests
# and benchmarks; abort-on-panic prevents catch_unwind in integration tests and
# would silently override the caller's panic strategy when cortyx is used as a
# library dependency.  The binary size impact is negligible with strip = "symbols"
# and lto = true already applied.
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
missing_docs = "allow"
unused_imports = "allow"

[lints.clippy]
all = "allow"

# Deny unsafe patterns in production code via crate attributes where needed.
unwrap_used = "allow"
expect_used = "allow"
panic = "allow"
indexing_slicing = "allow"

# Code quality
too_many_arguments = "warn"
