[package]
name = "cortyx"
version = "0.5.0"
edition = "2021"
description = "MCP-native context delivery engine — local long-term memory, prompt-cache-aware context reuse, BM25 + hybrid retrieval"
license = "MIT"
readme = "README.md"
repository = "https://github.com/sorunokoe/Cortyx"
keywords = ["llm", "mcp", "context", "memory", "ai"]
categories = ["command-line-utilities", "development-tools"]

[features]
# Default build: hybrid BM25 + dense retrieval.
# Requires ~80MB ONNX model (downloaded once to ~/.cortyx/models/ on first use).
# Build with --no-default-features for the 7MB air-gapped BM25-only binary.
default = ["embed", "rerank"]
# Dense embeddings via fastembed (all-MiniLM-L6-v2, 384-dim).
# Downloads ~80 MB of model weights on first use.
# Enables hybrid BM25 + dense cosine retrieval with RRF fusion in get_contexts.
# Falls back gracefully to BM25-only when embeddings.bin is absent or model not installed.
# TurboVec (turbovec) provides 4-bit quantized SIMD ANN search: 8x RAM reduction,
# full-corpus dense retrieval, and lock-free concurrent search.
embed = ["dep:fastembed", "dep:turbovec", "dep:blas-src"]
# Cross-encoder reranking via ONNX (ms-marco-MiniLM-L-2-v2 INT8 quantized, ~7 MB).
# Place .cortyx/reranker.onnx in the project root before use.
# Activates only on low-confidence BM25 queries (top_score < LOW_CONFIDENCE_THRESHOLD).
# ~100× smaller and faster than LLM reranking; no API calls; local/private.
rerank = ["dep:ort", "dep:tokenizers"]
# Local LLM answer synthesis via Ollama.
experimental = []
personal-families = []
[dependencies]
anyhow = "1.0.102"
bincode = "1.3.3"
blake3 = "1.8.4"
rayon = "1"
regex = "1.10"
clap = { version = "4.6.0", features = ["derive"] }
fastembed = { version = "5", optional = true }
turbovec = { version = "0.4.1", optional = true }
crc32fast = "1"
ort = { version = "=2.0.0-rc.10", optional = true }
tokenizers = { version = "0.19", optional = true }
notify = "8.2.0"
rmcp = { version = "1.4.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.8"
tokio = { version = "1.51.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
dirs = "6.0.0"
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.4"

[target.'cfg(target_os = "macos")'.dependencies]
blas-src = { version = "0.10", features = ["accelerate"], optional = true }

[profile.release]
opt-level = 3
strip = "symbols"
# panic = "abort" removed: cortyx exposes src/lib.rs for in-process use by tests
# and benchmarks; abort-on-panic prevents catch_unwind in integration tests and
# would silently override the caller's panic strategy when cortyx is used as a
# library dependency.  The binary size impact is negligible with strip = "symbols"
# and lto = true already applied.
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unused_imports = "warn"

[lints.clippy]
# Code quality
too_many_arguments = "warn"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
missing_errors_doc = "warn"
must_use_candidate = "warn"
unwrap_used = "warn"
